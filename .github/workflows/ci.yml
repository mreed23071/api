name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The fast suite must never need a real database; this DSN is only parsed.
  DATABASE_URL: postgresql+asyncpg://mabinsoft:mabinsoft@localhost:5432/mabinsoft_test

jobs:
  static:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: make lint
      - run: make typecheck

  test:
    name: Fast suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Unit, API and contract tests
        run: make test-cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Integration suite (pgvector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --group integration
      # testcontainers starts pgvector itself; the runner only needs Docker,
      # which ubuntu-latest already has.
      - run: make test-integration

  contract:
    name: OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Fail if the committed schema is out of date
        run: make openapi-check

  build:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
